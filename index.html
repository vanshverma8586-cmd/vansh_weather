<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-PR36XF309Z"></script>
<script>
      window.dataLayer = window.dataLayer || [];
         function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
          gtag('config', 'G-PR36XF309Z');
</script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(to right, #4facfe, #00f2fe);
        }

        .container {
            background: white;
            padding: 25px;
            border-radius: 15px;
            width: 300px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .search-box {
            display: flex;
            margin-bottom: 20px;
        }

        .search-box input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 10px 0 0 10px;
            outline: none;
        }

        .search-box button {
            padding: 10px;
            border: none;
            background: #4facfe;
            color: white;
            border-radius: 0 10px 10px 0;
            cursor: pointer;
        }

        .weather-icon {
            font-size: 60px;
            margin: 10px 0;
        }

        .temp {
            font-size: 40px;
            font-weight: bold;
        }

        .city {
            font-size: 22px;
            margin: 5px 0;
        }

        .details {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }

        .details div {
            text-align: center;
        }

        .label {
            font-size: 14px;
            color: gray;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Search -->
        <div class="search-box">
            <input type="text" placeholder="Enter city..." id="cityInput">
            <button id="searchBtn">Search</button>
        </div>

        <!-- Weather Info -->
        <div class="weather-icon">☀️</div>
        <div class="temp" id="temp">25°C</div>
        <div class="city" id="city">Delhi</div>

        <!-- Extra Details -->
        <div class="details">
            <div>
                <div id="humidity">60%</div>
                <div class="label">Humidity</div>
            </div>
            <div>
                <div id="wind">10 km/h</div>
                <div class="label">Wind</div>
            </div>
        </div>
    </div>
    <script>
        const input = document.querySelector("#cityInput");
        const btn = document.querySelector("#searchBtn");
        let temp = document.querySelector("#temp");
        let humidity = document.querySelector("#humidity");
        let wind = document.querySelector("#wind");
        let cityText = document.querySelector("#city");

        const API_KEY = "6a1b3d8068bb4b799f6161236261804";

        btn.addEventListener("click", () => {
            const cityName = input.value;
            getWeather(cityName);
        });

        const getWeather = async (cityName) => {
            console.log("Fetching weather data...");

            const URL = `https://api.weatherapi.com/v1/current.json?key=${API_KEY}&q=${cityName}`;
            let response = await fetch(URL);
            console.log(response);
            let data = await response.json();

            temp.innerHTML = `${data.current.temp_c}°C`;
            humidity.innerHTML = `${data.current.humidity}%`;
            wind.innerHTML = `${data.current.wind_kph} km/h`;
            cityText.innerHTML = `${data.location.name}`;
        };

        getWeather("Delhi,India");
    </script>
</body>
</html>
